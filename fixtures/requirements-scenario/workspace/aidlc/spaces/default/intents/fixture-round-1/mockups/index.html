<!doctype html><html lang="ja"><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>合成メモ画面</title><h1>メモ一覧（合成 fixture）</h1><button id="add" type="button">メモを追加</button><ul id="notes"><li>最初のメモ</li></ul><script>document.querySelector('#add').onclick=()=>{const li=document.createElement('li');li.textContent='新しいメモ';document.querySelector('#notes').append(li)};</script></html>
