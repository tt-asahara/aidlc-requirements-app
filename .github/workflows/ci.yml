name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-browser-failure
          path: test-results
          retention-days: 1

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: docker compose -p aidlc-ci build
      - run: docker compose -p aidlc-ci up -d --wait --wait-timeout 60
      - run: bun run e2e:docker
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-browser-failure
          path: test-results/docker
          retention-days: 1
      - if: always()
        run: docker compose -p aidlc-ci logs --tail=40 && docker compose -p aidlc-ci down
